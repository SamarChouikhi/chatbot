<div class="popup-overlay" [class.open]="isOpen" (click)="onBackdropClick($event)">
  <div class="popup-panel" [class.open]="isOpen" [style.--accent]="context?.accentColor">

    <!-- ── Header ───────────────────────────────────────── -->
    <div class="popup-header">
      <div class="popup-title-row">
        <span class="domain-icon">{{ context?.icon }}</span>
        <div class="popup-title-info">
          <span class="popup-title-text">{{ context?.title }}</span>
          <span class="popup-subtitle">ARIA · {{ context?.period }}j</span>
        </div>
      </div>
      <button class="popup-close" (click)="close()" title="Fermer">
        <svg viewBox="0 0 24 24" width="16" height="16">
          <path d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z" fill="currentColor"/>
        </svg>
      </button>
    </div>

    <!-- ── KPI Summary ────────────────────────────────── -->
    <div class="kpi-summary" *ngIf="context">
      <div class="kpi-main-chip">
        <span class="kmc-val">{{ context.mainValue }}</span>
        <span class="kmc-unit">{{ context.unit }}</span>
        <span class="kmc-trend" [class.pos]="context.trendPositive" [class.neg]="!context.trendPositive">
          {{ context.trend }}
        </span>
      </div>
      <div class="kpi-metric-chips">
        <span class="metric-chip" *ngFor="let m of context.metrics">
          <span class="mc-label">{{ m.label }}</span>
          <span class="mc-val">{{ m.value }}</span>
        </span>
        <span class="critical-chip" *ngIf="context.criticals > 0">
          ⚠ {{ context.criticals }}
        </span>
      </div>
    </div>

    <!-- ── Messages ───────────────────────────────────── -->
    <div class="messages-area" #msgScroll>

      <!-- Thinking dots on first load before any content -->
      <div class="thinking-row" *ngIf="isStreaming && messages.length > 0 && messages[messages.length - 1]?.content === ''">
        <div class="thinking-dots">
          <span></span><span></span><span></span>
        </div>
      </div>

      <div *ngFor="let msg of messages" class="msg-row" [class.user-row]="msg.role === 'user'">

        <!-- User message -->
        <div *ngIf="msg.role === 'user'" class="msg-bubble user-bubble">
          {{ msg.content }}
        </div>

        <!-- Bot message -->
        <div *ngIf="msg.role === 'assistant'" class="msg-bubble bot-bubble" [class.streaming]="msg.streaming">
          <span class="aria-dot" [class.pulsing]="msg.streaming">✦</span>
          <div class="bot-text">
            <markdown [data]="msg.content"></markdown>
            <span class="stream-cursor" *ngIf="msg.streaming">▊</span>
          </div>
        </div>

      </div>
    </div>

    <!-- ── Quick Replies ──────────────────────────────── -->
    <div class="quick-replies" *ngIf="showQuickReplies">
      <button class="qr-btn"
              *ngFor="let qr of context?.quickReplies"
              (click)="sendQuickReply(qr)">
        {{ qr }}
      </button>
    </div>

    <!-- ── Input ──────────────────────────────────────── -->
    <div class="popup-input-area">
      <input
        class="popup-input"
        [(ngModel)]="inputText"
        (keydown)="onInputKeydown($event)"
        placeholder="Question de suivi..."
        [disabled]="isStreaming"
        autocomplete="off"
      />
      <button class="send-btn"
              (click)="submitInput()"
              [disabled]="isStreaming || !inputText.trim()"
              title="Envoyer">
        <svg viewBox="0 0 24 24" width="15" height="15">
          <path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z" fill="currentColor"/>
        </svg>
      </button>
    </div>

  </div>
</div>
