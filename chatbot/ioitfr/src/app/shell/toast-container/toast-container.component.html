<div class="toast-stack" role="region" aria-label="Notifications">
  <div
    class="toast-item"
    *ngFor="let t of toasts$ | async; trackBy: trackById"
    [class]="'sev-' + t.severity"
    role="alert"
    aria-live="assertive"
  >
    <div class="toast-accent-bar"></div>

    <div class="toast-body">
      <div class="toast-head">
        <span class="toast-icon" [innerHTML]="icon(t.severity)"></span>
        <span class="toast-title">{{ t.title }}</span>
        <button class="toast-close" (click)="dismiss(t.id)" aria-label="Fermer">
          <svg viewBox="0 0 24 24">
            <path d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z" fill="currentColor"/>
          </svg>
        </button>
      </div>

      <p class="toast-msg" *ngIf="t.message">{{ t.message }}</p>

      <div class="toast-footer" *ngIf="t.deviceId">
        <svg viewBox="0 0 24 24"><path d="M17 8C8 10 5.9 16.17 3.82 21.34L5.71 22l1-2.3A4.49 4.49 0 0 0 8 20C19 20 22 3 22 3c-1 2-8 2-8 2" stroke="currentColor" stroke-width="1.6" fill="none" stroke-linecap="round"/></svg>
        <span>Dispositif #{{ t.deviceId }}<span *ngIf="t.value != null"> — {{ t.value }}{{ t.unit }}</span></span>
      </div>
    </div>
  </div>
</div>
