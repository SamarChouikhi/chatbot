# ---------------------------------------------------------
# CONFIGURATION BASE DE DONNÉES (MySQL)
# Valeurs par défaut pour le développement local.
# En production : définir DB_PASSWORD, TWILIO_*, MAILER_* comme variables d'environnement.
# ---------------------------------------------------------
quarkus.datasource.db-kind=mysql
quarkus.datasource.username=${DB_USER:root}
quarkus.datasource.password=${DB_PASSWORD:admin}
quarkus.datasource.jdbc.url=${DB_URL:jdbc:mysql://localhost:3306/bw_samar?serverTimezone=UTC}

# Connection pool — sized for concurrent dashboard requests
quarkus.datasource.jdbc.max-size=30
quarkus.datasource.jdbc.min-size=5
quarkus.datasource.jdbc.acquisition-timeout=30
quarkus.datasource.jdbc.max-lifetime=PT30M

# Désactive la génération automatique pour utiliser la table existante 'u_users'
quarkus.hibernate-orm.database.generation=none
quarkus.hibernate-orm.log.sql=false

# ---------------------------------------------------------
# CONFIGURATION SÉCURITÉ (JWT)
# ---------------------------------------------------------
mp.jwt.verify.publickey.location=META-INF/resources/publicKey.pem
smallrye.jwt.sign.key.location=META-INF/resources/privateKey.pem

mp.jwt.verify.issuer=${JWT_ISSUER:https://ioit.bws.com}
ioit.jwt.issuer=${JWT_ISSUER:https://ioit.bws.com}

# 1 heure (3600s) | refresh 7 jours (604800s)
ioit.jwt.duration=3600
ioit.jwt.refresh-duration=604800

# ---------------------------------------------------------
# CORS (frontend Angular)
# ---------------------------------------------------------
quarkus.http.cors=true
quarkus.http.cors.origins=${CORS_ORIGINS:http://localhost:4200}
quarkus.http.cors.methods=GET,POST,PUT,DELETE,OPTIONS,PATCH
quarkus.http.cors.headers=accept,authorization,content-type,x-requested-with,cache-control
quarkus.http.cors.access-control-allow-credentials=true

# ---------------------------------------------------------
# LOGGING
# ---------------------------------------------------------
quarkus.log.level=INFO
quarkus.log.category."org.example".level=DEBUG

# ---------------------------------------------------------
# TWILIO (SMS / WhatsApp)
# ---------------------------------------------------------
twilio.account.sid=${TWILIO_SID:}
twilio.auth.token=${TWILIO_TOKEN:}
twilio.whatsapp.number=${TWILIO_WA_NUMBER:whatsapp:+14155238886}
twilio.sms.number=${TWILIO_SMS_NUMBER:+14155238886}

recovery.token.length=6
recovery.token.expiry.minutes=10
recovery.max.attempts=3
recovery.block.minutes=15

# ---------------------------------------------------------
# CONFIGURATION EMAIL
# ---------------------------------------------------------
quarkus.mailer.from=${MAILER_FROM:chouikhisamar93@gmail.com}
quarkus.mailer.host=${MAILER_HOST:smtp.gmail.com}
quarkus.mailer.port=${MAILER_PORT:587}
quarkus.mailer.start-tls=REQUIRED
quarkus.mailer.username=${MAILER_USER:chouikhisamar93@gmail.com}
quarkus.mailer.password=${MAILER_PASSWORD:}
